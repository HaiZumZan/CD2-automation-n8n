name: Spring Boot CI Pipeline

on:
  push:
    branches: [ "main" ]
    # Tối ưu: Chỉ chạy CI Backend khi có sửa đổi trong thư mục Ckn8ntest
    paths:
      - 'Ckn8ntest/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Ckn8ntest/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Thuê một máy ảo Linux miễn phí của GitHub

    # Chỉ định thư mục làm việc mặc định cho tất cả các lệnh run
    defaults:
      run:
        working-directory: ./Ckn8ntest

    steps:
    # Bước 1: Lấy code mới nhất từ GitHub về máy ảo
    - name: Tải Source Code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt Java 17 trên máy ảo
    - name: Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Tự động lưu cache để lần sau chạy nhanh hơn

    # Bước 3: Chạy lệnh Build VÀ Test
    - name: Đóng gói và Kiểm thử với Maven
      run: mvn clean package
      
    # Ghi chú: Nếu sau này có Server thật, bạn sẽ thêm lệnh CD ở đây
    # run: scp target/KBAn8n.jar user@ip_server:/path/to/deploy
