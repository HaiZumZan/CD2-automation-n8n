name: Spring Boot CI Pipeline

# 1. KHI NÀO ROBOT CHẠY?
# Robot sẽ tự động chạy mỗi khi có ai đó Push code lên nhánh 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. ROBOT SẼ LÀM GÌ?
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Thuê một máy ảo Linux miễn phí của GitHub

    steps:
    # Bước 2.1: Lấy code mới nhất từ GitHub về máy ảo
    - name: Tải Source Code
      uses: actions/checkout@v3

    # Bước 2.2: Cài đặt Java 17 trên máy ảo
    - name: Cài đặt JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Tự động lưu cache để lần sau chạy nhanh hơn

    # Bước 2.3: Chạy lệnh Build (Biến code thành file .jar)
    - name: Đóng gói với Maven
      run: mvn clean package -DskipTests
      
    # Ghi chú: Nếu sau này có Server thật, bạn sẽ thêm lệnh CD ở đây
    # run: scp target/KBAn8n.jar user@ip_server:/path/to/deploy
